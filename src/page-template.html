<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{CANONICAL}}">

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:site_name" content="ООО «ФЕДСТРОЙ»">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="og:image" content="{{IMAGE}}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="{{IMAGE}}">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ea580c'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="./css/tailwind.css">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/adaptive.css">

  {{JSON_LD}}
</head>
<body class="bg-surface-50 text-slate-800 font-sans antialiased selection:bg-brand-500 selection:text-white">

  <!-- @@include blocks/header.html -->

  <main>
    <!-- Hero Banner -->
    <section class="bg-slate-950 text-white py-14 sm:py-20 border-b border-slate-800">
      <div class="page-container">
        <nav aria-label="Хлебные крошки" class="text-xs sm:text-sm text-slate-400 mb-6 flex items-center gap-2 flex-wrap">
          <a href="./index.html" class="hover:text-white transition-colors">Главная</a>
          <span aria-hidden="true">/</span>
          <span class="text-slate-200 font-medium">{{BREADCRUMB}}</span>
        </nav>

        <div class="grid lg:grid-cols-12 gap-10 items-center">
          <div class="lg:col-span-7 space-y-5">
            <div class="inline-block px-3.5 py-1.5 rounded-xl bg-brand-600/20 border border-brand-500/30 text-brand-400 text-xs sm:text-sm font-bold">
              {{PRICE_TAG}}
            </div>
            <h1 class="font-heading text-3xl sm:text-4xl xl:text-5xl font-extrabold tracking-tight leading-tight text-white">
              {{H1}}
            </h1>
            <p class="text-slate-300 text-base sm:text-lg leading-relaxed max-w-2xl">
              {{LEAD}}
            </p>
            <div class="flex flex-col sm:flex-row gap-4 pt-2">
              <button type="button" class="js-open-modal px-7 py-4 bg-brand-600 hover:bg-brand-500 active:scale-[0.98] text-white font-bold rounded-xl shadow-lg transition-all text-sm sm:text-base cursor-pointer" data-service="{{SERVICE_NAME}}">
                Запросить расчёт и КП
              </button>
              <a href="./index.html#calculator" class="px-7 py-4 bg-slate-900 hover:bg-slate-800 text-slate-100 border border-slate-700 font-semibold rounded-xl transition-all text-center text-sm sm:text-base">
                Онлайн-калькулятор сметы
              </a>
            </div>
          </div>

          <div class="lg:col-span-5">
            <div class="rounded-3xl overflow-hidden border border-slate-800 shadow-2xl bg-slate-900 h-64 sm:h-80">
              <img src="{{IMAGE}}" alt="{{H1}}" class="w-full h-full object-cover">
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Specs & Scope -->
    <section class="py-14 sm:py-20 bg-white border-b border-slate-200">
      <div class="page-container">
        <div class="grid lg:grid-cols-12 gap-10 items-start">
          <div class="lg:col-span-7">
            <h2 class="font-heading text-2xl sm:text-3xl font-extrabold text-slate-900 mb-6">
              Технические характеристики
            </h2>
            <div class="bg-surface-50 rounded-2xl border border-slate-200 overflow-hidden">
              <table class="w-full text-left text-sm">
                <tbody class="divide-y divide-slate-200">
                  {{SPECS_ROWS}}
                </tbody>
              </table>
            </div>
          </div>

          <div class="lg:col-span-5 bg-surface-50 rounded-3xl border border-slate-200 p-6 sm:p-8">
            <h2 class="font-heading text-xl sm:text-2xl font-bold text-slate-900 mb-4">
              Что входит в работу
            </h2>
            <ul class="space-y-3 text-sm text-slate-700 leading-relaxed mb-6">
              {{DETAILS_LIST}}
            </ul>
            <div class="pt-4 border-t border-slate-200 text-xs text-slate-500 space-y-1">
              <div>ООО «ФЕДСТРОЙ» • ИНН 7751382243 • Допуск СРО</div>
              <div>Телефон ПТО: <a href="tel:+78007000223" class="font-bold text-slate-900 hover:text-brand-600">8 (800) 700-02-23</a></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Related Directions -->
    <section class="py-12 sm:py-16 bg-surface-50">
      <div class="page-container">
        <h2 class="font-heading text-xl sm:text-2xl font-bold text-slate-900 mb-6">
          Смежные направления
        </h2>
        <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
          {{RELATED_LINKS}}
        </div>
      </div>
    </section>
  </main>

  <!-- @@include blocks/footer.html -->
  <!-- @@include blocks/floating-dock.html -->
  <!-- @@include blocks/modals.html -->

  <script type="module" src="./js/main.js"></script>
  <script nomodule src="./app.js"></script>
</body>
</html>
