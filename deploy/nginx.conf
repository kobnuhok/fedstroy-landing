# Конфигурация Nginx для продакшен-развертывания ООО «ФЕДСТРОЙ» в РФ
# Обеспечивает:
# 1. Загрузку чертежей и проектной документации до 50 МБ (client_max_body_size)
# 2. Глобальный аппаратный Rate Limiting на уровне Nginx
# 3. Кеширование статики и Gzip-сжатие
# 4. Проксирование на Node.js бэкенд

# Зона ограничения частоты запросов к API отправки заявок (макс. 15 запросов в минуту с 1 IP)
limit_req_zone $binary_remote_addr zone=lead_limit:10m rate=15r/m;

server {
    listen 80;
    server_name ooofedstroy.ru www.ooofedstroy.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ooofedstroy.ru www.ooofedstroy.ru;

    # SSL сертификаты (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/ooofedstroy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ooofedstroy.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Лимит тела запроса: 50 МБ (гарантирует беспрепятственную загрузку чертежей 35 МБ)
    client_max_body_size 50M;

    # Заголовки безопасности
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Корневой каталог для раздачи статики
    root /var/www/fedstroy-landing;
    index index.html;

    # Сжатие gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Раздача статических файлов и кеширование
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # API лидогенерации с ограничением частоты запросов
    location /api/lead {
        limit_req zone=lead_limit burst=5 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Общие эндпоинты API (/api/health и др.)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
